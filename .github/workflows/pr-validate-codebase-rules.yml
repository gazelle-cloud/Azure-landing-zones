name: pr - validate codebase rules

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install claude
        run: npm install -g @anthropic-ai/claude-code

      - name: collect diff and changed files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.patch
          git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
          git diff --name-only --diff-filter=D  origin/${{ github.base_ref }}...HEAD > /tmp/deleted.txt

      - name: build prompt
        run: |
          {
            echo "Validate this pull request against the knowledge graph rules already in your context."
            echo ""
            echo "Check every rule in each layer and return a verdict for every single one."
            echo "Do not skip rules that seem irrelevant — mark them pass with a note explaining why they do not apply."
            echo ""
            echo "Layer 1 — Foundations: check each of the 4 foundations (no-fixed-cost, no-human-touch, no-platform-ops, no-unapproved-resources)."
            echo "Layer 2 — Constitutive rules: check every constitutive rule in the knowledge graph."
            echo "Layer 3 — Regulative rules: check every regulative-entity and regulative-process rule."
            echo ""
            echo "Return only a JSON object with this exact shape:"
            echo '{"result":"PASS"|"FAIL","summary":{"what":"<2-3 sentences: what files and behaviour changed>","why":"<2-3 sentences: inferred intent or reason behind the change>"},"foundations":[{"rule":"<id>","status":"pass"|"fail","note":"<one line>","violation":"<matched violation text, omit if pass>","evidence":"<file and content, omit if pass>"}],"constitutive":[...],"regulative":[...]}'
            echo ""
            echo "Every rule must appear in its layer array. result is FAIL if any rule has status fail."
            echo "summary.what describes what the diff does; summary.why states the inferred reason, based on the change itself, not the PR title."
            echo ""
            echo "## Diff"
            echo '```'
            cat /tmp/diff.patch
            echo '```'
            echo ""
            echo "## Changed files (full content)"
          } > /tmp/prompt.txt

          TOTAL=0
          CAP=51200
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            [ "$file" = "knowledge-graph/graph.md" ] && continue
            SIZE=$(wc -c < "$file")
            TOTAL=$((TOTAL + SIZE))
            if [ $TOTAL -gt $CAP ]; then
              echo "<!-- content truncated at 50 KB limit -->" >> /tmp/prompt.txt
              break
            fi
            { echo "### $file"; echo '```'; cat "$file"; echo '```'; echo ""; } >> /tmp/prompt.txt
          done < /tmp/changed.txt

          if [ -s /tmp/deleted.txt ]; then
            { echo "## Deleted files (diff only)"; cat /tmp/deleted.txt; } >> /tmp/prompt.txt
          fi

      - name: run validation
        id: validate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          RAW=$(claude -p "$(cat /tmp/prompt.txt)" --output-format json 2>/dev/null)
          OUTPUT=$(echo "$RAW" | jq -r '.result // ""')
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "cost_usd=$(echo "$RAW" | jq -r '.total_cost_usd // .cost_usd // ""')" >> $GITHUB_OUTPUT
          echo "input_tokens=$(echo "$RAW" | jq -r '(.usage.input_tokens // 0) + (.usage.cache_read_input_tokens // 0) + (.usage.cache_creation_input_tokens // 0)')" >> $GITHUB_OUTPUT
          echo "output_tokens=$(echo "$RAW" | jq -r '.usage.output_tokens // 0')" >> $GITHUB_OUTPUT
          echo "model=$(echo "$RAW" | jq -r '.model // .model_id // ""')" >> $GITHUB_OUTPUT

      - name: post advisory comment
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTPUT: ${{ steps.validate.outputs.output }}
          COST_USD: ${{ steps.validate.outputs.cost_usd }}
          INPUT_TOKENS: ${{ steps.validate.outputs.input_tokens }}
          OUTPUT_TOKENS: ${{ steps.validate.outputs.output_tokens }}
          MODEL: ${{ steps.validate.outputs.model }}
        with:
          script: |
            const raw = process.env.VALIDATION_OUTPUT || '';
            let result = null;
            try {
              const match = raw.match(/\{[\s\S]*\}/);
              if (match) result = JSON.parse(match[0]);
            } catch (_) {}

            function renderLayer(label, rules) {
              if (!rules || rules.length === 0) return '';
              const failed = rules.filter(r => r.status === 'fail');
              const passed = rules.filter(r => r.status === 'pass');
              let s = `\n\n**${label}**`;
              if (failed.length === 0) s += ' ✅';
              if (failed.length > 0) {
                s += '\n' + failed.map(r =>
                  `- ❌ \`${r.rule}\`: ${r.violation}\n  > ${r.evidence}`
                ).join('\n');
              }
              if (passed.length > 0) {
                const items = passed.map(r => `- \`${r.rule}\`${r.note ? ': ' + r.note : ''}`).join('\n');
                s += `\n<details><summary>Passed (${passed.length})</summary>\n\n${items}\n</details>`;
              }
              return s;
            }

            function renderSummary(summary) {
              if (!summary) return '';
              let s = '';
              if (summary.what) s += `\n\n**What changed:** ${summary.what}`;
              if (summary.why)  s += `\n\n**Why:** ${summary.why}`;
              return s;
            }

            let body;
            if (!result) {
              body = `### ⚠️ Codebase Rules Validation — inconclusive\n\nCould not parse output.\n\`\`\`\n${raw.slice(0, 2000)}\n\`\`\``;
            } else if (result.result === 'PASS') {
              body = `### ✅ Codebase Rules Validation — no violations found`;
              body += renderSummary(result.summary);
              body += renderLayer('Foundations', result.foundations);
              body += renderLayer('Constitutive', result.constitutive);
              body += renderLayer('Regulative', result.regulative);
            } else {
              body = `### ⚠️ Codebase Rules Validation — advisory findings\n\n> These findings are advisory only and do not block merge.`;
              body += renderSummary(result.summary);
              body += renderLayer('Foundations', result.foundations);
              body += renderLayer('Constitutive', result.constitutive);
              body += renderLayer('Regulative', result.regulative);
            }

            const costUsd = parseFloat(process.env.COST_USD || '0');
            const costEur = costUsd * 0.92;
            const inputTokens = parseInt(process.env.INPUT_TOKENS || '0');
            const outputTokens = parseInt(process.env.OUTPUT_TOKENS || '0');
            const model = process.env.MODEL || '';
            const fmt = n => n.toLocaleString('en-US');
            const metaParts = [];
            if (model) metaParts.push(`**Model:** \`${model}\``);
            if (inputTokens || outputTokens)
              metaParts.push(`**Tokens:** ${fmt(inputTokens + outputTokens)} (${fmt(inputTokens)} in · ${fmt(outputTokens)} out)`);
            if (costEur)
              metaParts.push(`**Cost:** €${costEur.toFixed(4)}`);
            const meta = metaParts.length ? '\n\n' + metaParts.join(' · ') : '';

            body += `${meta}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
