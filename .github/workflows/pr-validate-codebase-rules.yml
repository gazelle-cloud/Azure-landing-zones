name: pr - validate codebase rules

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install claude
        run: npm install -g @anthropic-ai/claude-code

      - name: collect diff and changed files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.patch
          git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
          git diff --name-only --diff-filter=D  origin/${{ github.base_ref }}...HEAD > /tmp/deleted.txt

      - name: build prompt
        run: |
          {
            echo "Validate this pull request against the knowledge graph rules already in your context."
            echo "Return only a JSON object:"
            echo '{"result":"PASS"|"FAIL","passed":["<rule-id>",...],"violations":[{"rule":"<id>","violation":"<matched violation text>","evidence":"<file and content>"}]}'
            echo ""
            echo "## Diff"
            echo '```'
            cat /tmp/diff.patch
            echo '```'
            echo ""
            echo "## Changed files (full content)"
          } > /tmp/prompt.txt

          TOTAL=0
          CAP=51200
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            SIZE=$(wc -c < "$file")
            TOTAL=$((TOTAL + SIZE))
            if [ $TOTAL -gt $CAP ]; then
              echo "<!-- content truncated at 50 KB limit -->" >> /tmp/prompt.txt
              break
            fi
            { echo "### $file"; echo '```'; cat "$file"; echo '```'; echo ""; } >> /tmp/prompt.txt
          done < /tmp/changed.txt

          if [ -s /tmp/deleted.txt ]; then
            { echo "## Deleted files (diff only)"; cat /tmp/deleted.txt; } >> /tmp/prompt.txt
          fi

      - name: run validation
        id: validate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          OUTPUT=$(claude -p "$(cat /tmp/prompt.txt)" 2>/dev/null)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: post advisory comment
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTPUT: ${{ steps.validate.outputs.output }}
        with:
          script: |
            const raw = process.env.VALIDATION_OUTPUT || '';
            let result = null;
            try {
              const match = raw.match(/\{[\s\S]*\}/);
              if (match) result = JSON.parse(match[0]);
            } catch (_) {}

            const passedSection = (passed) => {
              if (!passed || passed.length === 0) return '';
              const items = passed.map(r => `- \`${r}\``).join('\n');
              return `\n\n<details><summary>Passed checks (${passed.length})</summary>\n\n${items}\n</details>`;
            };

            let body;
            if (!result) {
              body = `### ⚠️ Codebase Rules Validation — inconclusive\n\nCould not parse output.\n\`\`\`\n${raw.slice(0, 2000)}\n\`\`\``;
            } else if (result.result === 'PASS') {
              body = `### ✅ Codebase Rules Validation — no violations found`;
              body += passedSection(result.passed);
            } else {
              const lines = (result.violations || []).map(v =>
                `- **\`${v.rule}\`**: ${v.violation}\n  > ${v.evidence}`
              ).join('\n');
              body = `### ⚠️ Codebase Rules Validation — advisory findings\n\n> These findings are advisory only and do not block merge.\n\n${lines}`;
              body += passedSection(result.passed);
            }

            body += '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
