name: eval - pr validate codebase rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install claude
        run: npm install -g @anthropic-ai/claude-code

      - name: run fixtures
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          rm -f /tmp/eval-summary.csv

          OVERALL=0
          TOTAL_COST=0
          TOTAL_INPUT=0
          TOTAL_OUTPUT=0
          MODEL=""

          FIXTURE_DIRS=""
          EXPECTED_FILES=""
          for DIR in .github/eval/*/; do
            DIR="${DIR%/}"
            FIXTURE_DIRS="$FIXTURE_DIRS $DIR"
            EXPECTED_FILES="$EXPECTED_FILES $DIR/expected.json"
          done

          bash .github/scripts/build-combined-eval-prompt.sh $FIXTURE_DIRS > /tmp/combined-prompt.txt

          RAW=$(claude -p "$(cat /tmp/combined-prompt.txt)" --output-format json 2>/dev/null)
          OUTPUT=$(echo "$RAW" | jq -r '.result // ""')
          COST=$(echo "$RAW" | jq -r '.total_cost_usd // .cost_usd // 0')
          IN_TOKENS=$(echo "$RAW" | jq -r '(.usage.input_tokens // 0) + (.usage.cache_read_input_tokens // 0) + (.usage.cache_creation_input_tokens // 0)')
          OUT_TOKENS=$(echo "$RAW" | jq -r '.usage.output_tokens // 0')
          RUN_MODEL=$(echo "$RAW" | jq -r '.model // .model_id // ""')
          [ -n "$RUN_MODEL" ] && MODEL="$RUN_MODEL"

          echo "$OUTPUT" > /tmp/combined-output.txt
          bash .github/scripts/check-combined-eval.sh /tmp/combined-output.txt $EXPECTED_FILES
          OVERALL=$?

          TOTAL_TOKENS=$((IN_TOKENS + OUT_TOKENS))
          TOTAL_COST_EUR=$(awk -v u="$COST" 'BEGIN{printf "%.4f", u*0.92}')

          {
            echo "| fixture | result | evidence |"
            echo "|---|---|---|"
            while IFS=, read -r name status evidence; do
              ICON=$([ "$status" = "PASS" ] && echo ✅ || echo ❌)
              echo "| $name | $ICON $status | $evidence |"
            done < /tmp/fixture-results.csv
            echo ""
            echo "**Model:** \`$MODEL\` · **Total tokens:** $TOTAL_TOKENS ($IN_TOKENS in · $OUT_TOKENS out) · **Total cost:** €$TOTAL_COST_EUR"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $OVERALL
