name: pr - generate knowledge graph

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'knowledge-graph/vocabulary/**'
      - 'knowledge-graph/foundations/**'
      - 'knowledge-graph/constitutive/**'
      - 'knowledge-graph/regulative-entity/**'
      - 'knowledge-graph/regulative-process/**'

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: get github token
        id: github-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_GITHUB_AZUREPLATFORM_ID }}
          private-key: ${{ secrets.APP_GITHUB_AZUREPLATFORM_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.github-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: check graph freshness
        id: check
        shell: pwsh
        run: ./.github/utils/write-knowledge-graph.ps1 -Check
        continue-on-error: true

      - name: regenerate graph
        if: steps.check.outcome == 'failure'
        shell: pwsh
        run: ./.github/utils/write-knowledge-graph.ps1

      - name: commit and push
        if: steps.check.outcome == 'failure'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge-graph/graph.md
          git commit -m "regenerate knowledge-graph/graph.md [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
